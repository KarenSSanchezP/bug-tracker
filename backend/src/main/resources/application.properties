# ===== Conexión a la base de datos =====
# Se leen de variables de entorno; si no existen, se usan los valores locales por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bugtracker}
spring.datasource.username=${DB_USER:bugtracker}
spring.datasource.password=${DB_PASSWORD:bugtracker}

# ===== JPA / Hibernate =====
# "update" crea o actualiza las tablas automáticamente (cómodo en desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origen permitido para CORS (servidor de desarrollo de Vite)
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

server.port=${PORT:8080}
