<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRIAGE · Bug Tracker</title>
    <!-- Fuentes de la guía TRIAGE -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      // Aplica el tema guardado antes de pintar para evitar un "parpadeo" (oscuro por defecto)
      try { var t = localStorage.getItem('tema'); if (t === 'light' || t === 'dark') document.documentElement.className = t } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
